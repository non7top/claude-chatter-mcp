name: build

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ensure workspace permissions
        run: chmod -R a+rwX .

      - name: Build container image
        run: make build

      - name: Lint
        run: make lint

      - name: Run test suite
        run: make test

      - name: Package
        run: make package

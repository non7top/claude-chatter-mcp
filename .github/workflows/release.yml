name: Release

on:
  workflow_run:
    workflows: ["release-please"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)build and publish, e.g. v0.1.0'
        required: true

jobs:
  check-release-tag:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find_tag.outputs.tag }}
      stable: ${{ steps.find_tag.outputs.stable }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Find a release tag pointing at this commit
        id: find_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-release-tag
    if: needs.check-release-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Build container image
        run: make build

      - name: Package release artifacts
        run: make package

      - name: Keep the distributions for the PyPI job
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-dist
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/*

      - uses: sigstore/cosign-installer@v4.1.3

      - name: Sign the release files
        run: |
          for f in dist/*.tar.gz dist/*.whl dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.cosign.bundle" "$f"
          done

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-release-tag.outputs.tag }}
        run: >-
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY"
          dist/*.tar.gz dist/*.whl dist/SHA256SUMS dist/*.cosign.bundle

  pypi:
    needs: [check-release-tag, release]
    if: needs.check-release-tag.outputs.stable == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-dist
          path: dist

      - name: Check the built version matches the tag
        env:
          TAG: ${{ needs.check-release-tag.outputs.tag }}
        run: |
          ls dist/*-"${TAG#v}"-*.whl dist/*-"${TAG#v}".tar.gz

      - uses: pypa/gh-action-pypi-publish@v1.14.3

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-chatter-mcp"
version = "0.3.0"
description = "claude-chatter-mcp bridges MCP compatible agents to Claude's SendMessage/ListAgents implementation, allowing bidirectional communication."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "claude-chatter>=0.2.1",
    "psutil>=5.9.0",
    "fastmcp>=4.0.10",
]

[project.scripts]
bridge-mcp = "claude_chatter_mcp.cli:main"

[tool.setuptools]
packages = ["claude_chatter_mcp"]
